name: CatalogManageriOS
options:
  bundleIdPrefix: com.subliminalclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

targets:
  CatalogManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # iOS-специфичный UI-слой
      - path: CatalogManager
      # Общий, фреймворк-независимый Core (переиспользуется с macOS-версией)
      - path: ../Sources/CatalogManager/Core
    dependencies:
      - package: SwiftSoup
    info:
      path: CatalogManager/Info.plist
      properties:
        CFBundleDisplayName: Каталог
        # Папка приложения видна в «Файлах», можно открывать txt «на месте».
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.subliminalclub.catalogmanager
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        # Автоматическая подпись личной командой — нужна для запуска на iPhone.
        # На симуляторе подпись не требуется, эти настройки ей не мешают.
        DEVELOPMENT_TEAM: 5Z7A38JFLJ
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
